[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codesextant"
version = "0.28.0"
description = "Local code map for developers and AI agents, with tree-sitter symbols across 15 languages, import-resolved Python and TS/JS references, and one incremental index shared across local tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "AI King"}]
keywords = ["code-map", "static-analysis", "tree-sitter", "ai-agents", "call-graph", "pagerank"]
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack",
    "jedi>=0.19",
    "watchdog>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/Zeroxrain99/CodeSextant"
Repository = "https://github.com/Zeroxrain99/CodeSextant"
Issues = "https://github.com/Zeroxrain99/CodeSextant/issues"
Documentation = "https://github.com/Zeroxrain99/CodeSextant/blob/master/docs/getting-started.md"

[project.optional-dependencies]
# ruff is pinned, not floated. An unpinned linter in CI is a guard that turns red
# on somebody else's release for reasons unrelated to the change in front of you,
# which is how a fence stops being read.
test = ["pytest>=8", "ruff==0.16.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
codesextant = "codesextant.__main__:main"

[tool.setuptools]
packages = ["codesextant"]

[tool.setuptools.data-files]
"codesextant-skill" = ["skills/codesextant/SKILL.md"]

# Match the existing source style and keep lint focused on correctness.
[tool.ruff]
line-length = 100
target-version = "py310"
# Prototype scripts are excluded from product linting.
exclude = ["build", "dist", ".venv", "_poc_graph_c"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is the formatter's job; this list is for logic defects
    "SIM105",  # contextlib.suppress adds a call frame on a hot path
]

[tool.ruff.lint.per-file-ignores]
# panel.py embeds frontend assets as HTML/CSS/JS string literals, where line
# length and escaping rules do not apply.
"codesextant/panel.py" = ["E", "W"]
