<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeSextant 代碼星圖 · v2 震撼互動版（WebGPU + TSL）</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a10; overflow: hidden;
    font-family: "Segoe UI", system-ui, "Microsoft JhengHei", sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  .hud { position: fixed; left: 22px; top: 20px; z-index: 10; color: #cfe6ff;
    background: rgba(8,12,20,.55); border: 1px solid rgba(90,180,255,.22);
    border-radius: 12px; padding: 13px 17px; max-width: 320px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .hud h1 { margin: 0 0 5px; font-size: 15px; color: #6fd3ff; letter-spacing: .5px; }
  .hud .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px;
    background:rgba(60,200,255,.14); border:1px solid rgba(90,200,255,.35); color:#9fe3ff; margin-bottom:7px;}
  .hud p { margin: 3px 0; font-size: 12px; line-height: 1.5; color: #acc6e0; }
  .hud b { color: #eaf4ff; }
  #stat { position: fixed; right: 20px; bottom: 16px; z-index: 10; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; color: #7fb6e6; background: rgba(8,12,20,.5); padding: 7px 11px; border-radius: 8px; text-shadow:0 1px 2px #000;}
  #hover { position: fixed; z-index: 12; pointer-events: none; transform: translate(-50%, calc(-100% - 14px));
    background: rgba(10,16,26,.9); border: 1px solid rgba(110,200,255,.4); color: #dff1ff; font-size: 12px;
    padding: 4px 9px; border-radius: 7px; white-space: nowrap; display: none; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #panel { position: fixed; right: 0; top: 0; height: 100%; width: 430px; z-index: 14;
    background: linear-gradient(180deg, rgba(10,15,24,.97), rgba(8,12,20,.97));
    border-left: 1px solid rgba(110,200,255,.28); box-shadow: -10px 0 40px rgba(0,0,0,.5);
    transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
  #panel.show { transform: translateX(0); }
  #panel .ph { padding: 16px 18px 10px; border-bottom: 1px solid rgba(110,200,255,.18); }
  #panel .pk { font-size: 11px; color: #6fd3ff; text-transform: uppercase; letter-spacing: 1px; }
  #panel .pn { font-size: 19px; color: #eaf4ff; margin: 4px 0 2px; word-break: break-all; }
  #panel .pf { font-size: 12px; color: #88a4c4; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  #panel pre { flex: 1; margin: 0; padding: 14px 16px; overflow: auto; font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px; line-height: 1.55; color: #c9d6e6; tab-size: 4; }
  #panel .kw { color: #c79bff; } #panel .st { color: #9ce8a0; } #panel .cm { color: #5f7388; font-style: italic; }
  #panel .fn { color: #6fd3ff; } #panel .nm { color: #ffd479; }
  #panel .close { position: absolute; right: 12px; top: 12px; cursor: pointer; color: #88a4c4; font-size: 20px;
    width: 28px; height: 28px; text-align: center; line-height: 26px; border-radius: 6px; }
  #panel .close:hover { background: rgba(255,255,255,.08); color: #fff; }
  #intro { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 11; color: #9fe3ff;
    font-size: 13px; letter-spacing: 2px; text-shadow: 0 0 12px rgba(80,200,255,.6); transition: opacity 1s; }
  #err { position: fixed; inset: 0; z-index: 30; display:none; place-items:center; color:#ffd0d0;
    background: rgba(20,4,4,.88); text-align:center; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <span class="tag">v2 · WebGPU + TSL · 震撼互動</span>
  <h1>CodeSextant 代碼星圖</h1>
  <p>598 個真實符號 · 引用關係 · 社群分群</p>
  <p><b>滑鼠移</b>＝高亮鄰近 · <b>點節點</b>＝飛近看真實代碼<br><b>拖曳</b>＝旋轉 · <b>滾輪</b>＝縮放</p>
</div>
<div id="stat">init…</div>
<div id="hover"></div>
<div id="panel"><div class="close" id="pclose">×</div>
  <div class="ph"><div class="pk" id="pk">function</div><div class="pn" id="pn">name</div><div class="pf" id="pf">file</div></div>
  <pre id="pcode"></pre>
</div>
<div id="intro">粒子聚合中…</div>
<div id="err"><div><h2>WebGPU 初始化失敗</h2><p id="errmsg"></p></div></div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
    "three/webgpu": "https://unpkg.com/three@0.171.0/build/three.webgpu.js",
    "three/tsl": "https://unpkg.com/three@0.171.0/build/three.tsl.js",
    "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { attribute, instancedBufferAttribute, uniform, mix, smoothstep, clamp, float, vec3, vec4,
         abs as tabs, pass, texture } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadGraph, buildBuffers } from './graph-common.js';

const statEl = document.getElementById('stat');
// 心跳：一鍵啟動的 server 靠這個知道分頁還開著（關分頁停心跳 → server 30 秒後自動結束、無殘留）
setInterval(() => { fetch('/ping').catch(() => {}); }, 5000);
fetch('/ping').catch(() => {});
const fail = (m) => { document.getElementById('err').style.display = 'grid';
  document.getElementById('errmsg').textContent = m; statEl.textContent = '錯誤：' + m; window.__error = m; };

if (!navigator.gpu) { fail('此瀏覽器無 WebGPU（如 Firefox）。正式版會自動降級 WebGL2/CSS。'); }
else { main().catch(e => fail(e.message || String(e))); }

// ── Web Audio 合成音效（hover/click，無外部音檔=離線可用；首次手勢解鎖 autoplay）──
let actx = null;
function unlockAudio() { if (!actx) { try { actx = new (AudioContext || webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume(); }
addEventListener('pointerdown', unlockAudio, { once: false });
function beep(freq, dur, vol, type) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(actx.destination);
  const t = actx.currentTime;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
let lastHoverBeep = 0;
function hoverBeep() { const n = performance.now(); if (n - lastHoverBeep < 70) return; lastHoverBeep = n; beep(900 + Math.random() * 120, 0.05, 0.025, 'sine'); }
function clickBeep() { beep(523, 0.16, 0.06, 'triangle'); setTimeout(() => beep(784, 0.18, 0.045, 'sine'), 40); }

// ── 極簡語法高亮（Python/JS 關鍵字，離線、夠用）──
const KW = /\b(def|class|return|import|from|if|elif|else|for|while|with|try|except|finally|raise|yield|async|await|lambda|function|const|let|var|export|new|this|extends|interface|type|public|private|static|void|int|float|bool|str|self|None|True|False|null|undefined)\b/g;
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function highlight(code) {
  return esc(code)
    .replace(/(#.*$|\/\/.*$)/gm, '<span class="cm">$1</span>')
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="st">$1</span>')
    .replace(KW, '<span class="kw">$1</span>');
}

async function main() {
  const W0 = () => innerWidth, H0 = () => innerHeight;
  const renderer = new THREE.WebGPURenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(W0(), H0());
  renderer.setClearColor(0x070a10, 1);
  await renderer.init();

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070a10, 0.00026);
  const camera = new THREE.PerspectiveCamera(55, W0() / H0(), 1, 16000);
  camera.position.set(0, 0, 3600);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 80; controls.maxDistance = 9000;

  const graph = await loadGraph('graph_real.json');
  const buf = buildBuffers(graph);   // {N,E,pos,col,siz,lpos,lcol,C}
  const N = buf.N;

  // 節點最終 world 位置（picking + 飛近用；scene 不旋轉，world == target）
  const nodeWorld = [];
  for (let i = 0; i < N; i++) nodeWorld.push(new THREE.Vector3(buf.pos[i * 3], buf.pos[i * 3 + 1], buf.pos[i * 3 + 2]));
  // 相機依佈局範圍自適應（real 小圖不會太遠看不見）
  let maxR = 1;
  for (let i = 0; i < N; i++) maxR = Math.max(maxR, nodeWorld[i].length());
  camera.position.set(0, maxR * 0.12, maxR * 2.25);
  controls.minDistance = 40; controls.maxDistance = maxR * 6;

  // 開場：start = 隨機散開大球；target = 社群佈局；seed = per-particle 延遲
  const startArr = new Float32Array(N * 3), seedArr = new Float32Array(N), aidArr = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = 2600 + Math.random() * 2600, a = Math.random() * Math.PI * 2, b = (Math.random() - 0.5) * Math.PI;
    startArr[i * 3] = Math.cos(a) * Math.cos(b) * r;
    startArr[i * 3 + 1] = Math.sin(b) * r;
    startArr[i * 3 + 2] = Math.sin(a) * Math.cos(b) * r;
    seedArr[i] = Math.random();
    aidArr[i] = i;
  }

  // 節點：WebGPU 大圓點要用 THREE.Sprite + count + instancedBufferAttribute
  // （THREE.Points 的 sizeNode 在 WebGPU 無效＝全 1px 看不見，研究 issue #30612）
  const startIA = new THREE.InstancedBufferAttribute(startArr, 3);
  const targetIA = new THREE.InstancedBufferAttribute(buf.pos, 3);
  const colorIA = new THREE.InstancedBufferAttribute(buf.col, 3);
  const sizeIA = new THREE.InstancedBufferAttribute(buf.siz, 1);
  const seedIA = new THREE.InstancedBufferAttribute(seedArr, 1);
  const aidIA = new THREE.InstancedBufferAttribute(aidArr, 1);

  const morphP = uniform(0), uSel = uniform(-1), uHover = uniform(-1);
  const startN = instancedBufferAttribute(startIA);
  const targetN = instancedBufferAttribute(targetIA);
  const colorN = instancedBufferAttribute(colorIA);
  const sizeN = instancedBufferAttribute(sizeIA);
  const seedN = instancedBufferAttribute(seedIA);
  const aidN = instancedBufferAttribute(aidIA);

  // 開場 morph：per-particle 用 seed 錯開抵達時間 → 自然聚合，不齊步
  const t = smoothstep(float(0), float(1), clamp(morphP.mul(1.5).sub(seedN.mul(0.5)), float(0), float(1)));
  const pmat = new THREE.PointsNodeMaterial({ transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: false });
  pmat.positionNode = mix(startN, targetN, t);

  // 選中 / hover 放大＋加亮（aid 比對 uniform）
  const isSel = tabs(aidN.sub(uSel)).lessThan(float(0.5));
  const isHov = tabs(aidN.sub(uHover)).lessThan(float(0.5));
  const emph = clamp(isSel.select(float(1), float(0)).add(isHov.select(float(0.6), float(0))), float(0), float(1));
  pmat.sizeNode = sizeN.mul(float(5.2)).mul(float(1).add(emph.mul(2.6))).mul(t.add(0.12));
  pmat.colorNode = vec4(colorN.add(vec3(0.5, 0.75, 1.0).mul(emph)), float(1));
  // 圓點：Sprite 有內建 uv → texture 取樣合法（圓形柔邊 alpha）
  try {
    const cc = document.createElement('canvas'); cc.width = cc.height = 64;
    const cx = cc.getContext('2d'); const g = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.9)');
    g.addColorStop(1, 'rgba(255,255,255,0)'); cx.fillStyle = g; cx.fillRect(0, 0, 64, 64);
    pmat.opacityNode = texture(new THREE.CanvasTexture(cc));
  } catch (e) { console.warn('disc texture 失敗，退方點', e); }

  const points = new THREE.Sprite(pmat);
  points.count = N;
  points.frustumCulled = false;
  scene.add(points);

  // 連線（開場聚合完成後淡入）
  const lgeo = new THREE.BufferGeometry();
  lgeo.setAttribute('position', new THREE.BufferAttribute(buf.lpos, 3));
  lgeo.setAttribute('color', new THREE.BufferAttribute(buf.lcol, 3));
  const uLineOp = uniform(0);
  const lmat = new THREE.LineBasicNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  lmat.colorNode = attribute('color', 'vec3');
  lmat.opacityNode = uLineOp;
  scene.add(new THREE.LineSegments(lgeo, lmat));

  // bloom 後處理
  const post = new THREE.PostProcessing(renderer);
  const scenePass = pass(scene, camera);
  const bloomPass = bloom(scenePass.getTextureNode(), 0.42, 0.55, 0.5);
  post.outputNode = scenePass.getTextureNode().add(bloomPass);

  // ── 互動 ──
  let selected = -1, hover = -1, fly = null, morphDone = false;
  const introEl = document.getElementById('intro'), hoverEl = document.getElementById('hover');
  const panel = document.getElementById('panel');

  function project(i) { const v = nodeWorld[i].clone().project(camera);
    return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight, behind: v.z > 1 }; }

  function pick(mx, my) {
    if (!morphDone) return -1;
    let best = -1, bestD = 26;
    for (let i = 0; i < N; i++) {
      const p = project(i); if (p.behind) continue;
      const sizeBoost = Math.min(14, 4 + (graph.nodes[i].rank || 0) * 16);
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < bestD + sizeBoost) { bestD = d - sizeBoost; best = i; }
    }
    return best;
  }

  const cv = renderer.domElement;
  cv.addEventListener('pointermove', (e) => {
    const i = pick(e.clientX, e.clientY);
    if (i !== hover) { hover = i; uHover.value = i; if (i >= 0) hoverBeep(); }
    if (i >= 0) {
      const n = graph.nodes[i];
      hoverEl.style.display = 'block'; hoverEl.style.left = e.clientX + 'px'; hoverEl.style.top = e.clientY + 'px';
      hoverEl.innerHTML = `<b style="color:#9fe3ff">${n.kind}</b> ${n.name}`;
      cv.style.cursor = 'pointer';
    } else { hoverEl.style.display = 'none'; cv.style.cursor = 'crosshair'; }
  });
  cv.addEventListener('pointerleave', () => { hover = -1; uHover.value = -1; hoverEl.style.display = 'none'; });

  let downXY = null;
  cv.addEventListener('pointerdown', (e) => { downXY = [e.clientX, e.clientY]; });
  cv.addEventListener('pointerup', (e) => {
    if (!downXY) return;
    const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
    downXY = null;
    if (moved > 6) return;   // 拖曳旋轉、非點擊
    const i = pick(e.clientX, e.clientY);
    if (i >= 0) selectNode(i);
  });

  function selectNode(i) {
    selected = i; uSel.value = i; clickBeep();
    const n = graph.nodes[i];
    document.getElementById('pk').textContent = n.kind || 'symbol';
    document.getElementById('pn').textContent = n.name;
    document.getElementById('pf').textContent = `${n.file}:${n.line}`;
    document.getElementById('pcode').innerHTML = highlight(n.code || '（此符號無代碼片段）');
    panel.classList.add('show');
    // 相機飛近
    const p = nodeWorld[i];
    const dir = camera.position.clone().sub(controls.target).normalize();
    const dist = 360 + Math.min(14, (n.rank || 0) * 16) * 18;
    fly = { fromP: camera.position.clone(), toP: p.clone().add(dir.multiplyScalar(dist)),
            fromT: controls.target.clone(), toT: p.clone(), t0: performance.now(), dur: 850 };
  }
  document.getElementById('pclose').onclick = () => { panel.classList.remove('show'); selected = -1; uSel.value = -1; };
  // 給 playwright 截圖測互動效果
  window.__selectNode = selectNode;
  window.__selectTop = () => { let bi = 0, br = -1; for (let i = 0; i < N; i++) { const r = graph.nodes[i].rank || 0; if (r > br) { br = r; bi = i; } } selectNode(bi); return graph.nodes[bi].name; };

  // ── 主迴圈 ──
  const T0 = performance.now();
  const GATHER_DELAY = 900, GATHER_DUR = 3000;
  let frames = 0, fpsT = performance.now(), fps = 0;
  const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  window.__ready = false;

  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now(), el = now - T0;
    // 開場聚合
    if (!morphDone) {
      const p = Math.min(1, Math.max(0, (el - GATHER_DELAY) / GATHER_DUR));
      morphP.value = ease(p);
      uLineOp.value = Math.max(0, (morphP.value - 0.78) / 0.22) * 0.5;
      if (p >= 1) { morphDone = true; introEl.style.opacity = 0; setTimeout(() => introEl.remove(), 1100); }
    }
    // 相機飛近補間
    if (fly) {
      const k = Math.min(1, (now - fly.t0) / fly.dur), e = ease(k);
      camera.position.lerpVectors(fly.fromP, fly.toP, e);
      controls.target.lerpVectors(fly.fromT, fly.toT, e);
      if (k >= 1) fly = null;
    }
    controls.update();
    post.render();
    frames++;
    if (now - fpsT > 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    statEl.textContent = `WebGPU+TSL · ${N} 節點 · ${buf.E} 連線 · ${buf.C} 社群 · ${fps} fps`
      + (morphDone ? ' · 可互動' : ' · 聚合中');
    if (el > GATHER_DELAY + GATHER_DUR + 400) window.__ready = true;
  }
  animate();
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); });
}
</script>
</body>
</html>
