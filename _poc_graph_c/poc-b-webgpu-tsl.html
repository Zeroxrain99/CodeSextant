<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeSextant 功能 C · PoC-B · WebGPU + TSL（你點名的技術）</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e14; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: fixed; left: 22px; top: 20px; z-index: 10;
    font-family: "Segoe UI", system-ui, sans-serif; color: #e8d6ff;
    background: rgba(10, 8, 20, 0.62); border: 1px solid rgba(170, 120, 255, 0.26);
    border-radius: 12px; padding: 14px 18px; backdrop-filter: blur(2px);
    text-shadow: 0 1px 3px rgba(0,0,0,.8); max-width: 330px;
  }
  .hud h1 { margin: 0 0 6px; font-size: 15px; letter-spacing: .5px; color: #c79bff; }
  .hud .tag { display:inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(170,90,255,.16); border:1px solid rgba(180,120,255,.4); color:#d8b6ff; margin-bottom:8px;}
  .hud p { margin: 4px 0; font-size: 12px; line-height: 1.5; color: #c8b6e0; }
  .hud b { color: #f3eaff; }
  #stat { position: fixed; right: 22px; bottom: 18px; z-index: 10;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #b48fe6;
    background: rgba(10,8,20,.55); padding: 8px 12px; border-radius: 8px; text-shadow:0 1px 2px #000;}
  #warn { position: fixed; inset: 0; z-index: 20; display:none; place-items:center;
    font-family: system-ui, sans-serif; color:#ffd0d0; background: rgba(20,4,4,.86); text-align:center; }
  #warn div { max-width: 520px; padding: 28px; }
  #warn h2 { color:#ff8a8a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <span class="tag">PoC-B · WebGPU + TSL 路線</span>
  <h1>CodeSextant 代碼關係圖</h1>
  <p>渲染：<b>WebGPU + TSL bloom</b>（＝你點名的技術）</p>
  <p>節點＝符號（大小＝PageRank）<br>連線＝引用關係 · 顏色＝社群分群</p>
  <p style="color:#f99">⚠ Firefox 等無 WebGPU 的瀏覽器會走右側紅屏（負債）</p>
</div>
<div id="stat">init…</div>
<div id="warn"><div><h2>此瀏覽器不支援 WebGPU</h2>
  <p>例如 Firefox 2026 仍預設關閉 WebGPU。daemon 面板若用這類瀏覽器直接開＝黑屏。<br>
  這正是紅隊指出 WebGPU 在「自包含面板給陌生人開」情境的負債。</p></div></div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
    "three/webgpu": "https://unpkg.com/three@0.171.0/build/three.webgpu.js",
    "three/tsl": "https://unpkg.com/three@0.171.0/build/three.tsl.js",
    "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { attribute, Fn, vec4, vec3, uv, smoothstep, float } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { pass } from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadGraph, buildBuffers } from './graph-common.js';

const params = new URLSearchParams(location.search);
const DATA = params.get('data') || 'graph_synth.json';
const statEl = document.getElementById('stat');

if (!navigator.gpu) {
  document.getElementById('warn').style.display = 'grid';
  statEl.textContent = 'WebGPU 不可用';
  window.__error = 'no-webgpu';
} else {
  run().catch(e => { statEl.textContent = '錯誤：' + e.message; window.__error = e.message; });
}

async function run() {
  const t0 = performance.now();
  const renderer = new THREE.WebGPURenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x0a0e14, 1);
  await renderer.init(); // ⛔ 漏了會黑屏（/gpu 已知坑）

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0e14, 0.00035);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 12000);
  camera.position.set(0, 0, 3300);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const graph = await loadGraph(DATA);
  const buf = buildBuffers(graph);

  // 連線
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(buf.lpos, 3));
  lg.setAttribute('color', new THREE.BufferAttribute(buf.lcol, 3));
  const lm = new THREE.LineBasicNodeMaterial({ transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false });
  lm.colorNode = attribute('color', 'vec3');
  scene.add(new THREE.LineSegments(lg, lm));

  // 節點（TSL：圓形 + 核心發光）
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(buf.pos, 3));
  pg.setAttribute('color', new THREE.BufferAttribute(buf.col, 3));
  pg.setAttribute('size', new THREE.BufferAttribute(buf.siz, 1));
  const pm = new THREE.PointsNodeMaterial({ transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false });
  pm.sizeNode = attribute('size', 'float');
  // ⚠ TSL gotcha 實錘：Points 無 sprite uv attribute（uv() 警告 "not found on geometry"）→ 圓點做不出。
  // WebGL2 用 gl_PointCoord 一行就有圓點+核心發光；WebGPU/TSL 這版只能退方點靠 bloom 糊成發光團。
  pm.colorNode = attribute('color', 'vec3');
  const pts = new THREE.Points(pg, pm);
  pts.frustumCulled = false;
  scene.add(pts);

  // TSL bloom 後處理
  const post = new THREE.PostProcessing(renderer);
  const scenePass = pass(scene, camera);
  const bloomPass = bloom(scenePass, 0.5, 0.5, 0.42);
  post.outputNode = scenePass.add(bloomPass);

  const buildMs = (performance.now() - t0).toFixed(0);
  let frames = 0, fpsT = performance.now(), fps = 0;
  window.__ready = false;

  function animate() {
    requestAnimationFrame(animate);
    scene.rotation.y += 0.0009;
    scene.rotation.x = Math.sin(performance.now() * 0.00006) * 0.12;
    controls.update();
    post.render();
    frames++;
    const now = performance.now();
    if (now - fpsT > 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    statEl.textContent = `WebGPU+TSL · ${buf.N.toLocaleString()} 節點 · ${buf.E.toLocaleString()} 連線 · ${buf.C} 社群 · ${fps} fps · 建圖 ${buildMs}ms`;
    if (now - t0 > 1600) window.__ready = true;
  }
  animate();
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}
</script>
</body>
</html>
